name: Harvest

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry + deps
        run: |
          pip install poetry
          cd apps/scholarharvester && poetry install --without dev

      - name: Execute harvest
        env:
          SUPABASE_DB_DSN: ${{ secrets.SUPABASE_DB_DSN }}
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
        run: |
          cd apps/scholarharvester
          if [ -n "$SUPABASE_DB_DSN" ]; then
            poetry run python harvest.py --since 2022
            if [ -n "$COLLEGE_SCORECARD_API_KEY" ]; then
              poetry run scholarharvester institutions sync-scorecard --max-records 1000 --state CA
            fi
          else
            echo "SUPABASE_DB_DSN not set; running validation adapter harvest"
            poetry run python -c "from scholarharvester.adapters import ADAPTERS; [a({}) for a in ADAPTERS.values()]; print('All adapters verified successfully.')"
          fi
