name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install Poetry
        run: pip install poetry

      - name: Install ScholarHarvester deps
        run: poetry install --no-interaction --no-ansi
        working-directory: apps/scholarharvester

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/scholarpath/package-lock.json

      - name: Install ScholarPath deps
        run: npm ci
        working-directory: apps/scholarpath

      - name: Ruff + mypy (ScholarHarvester)
        run: |
          poetry run ruff check .
          poetry run mypy src
        working-directory: apps/scholarharvester

      - name: Next.js lint
        run: npm run lint
        working-directory: apps/scholarpath

  test-web-and-harvester:
    name: Test Web & Data Pipeline
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install Poetry
        run: pip install poetry

      - name: Install ScholarHarvester deps
        run: poetry install --no-interaction --no-ansi
        working-directory: apps/scholarharvester

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/scholarpath/package-lock.json

      - name: Install ScholarPath deps
        run: npm ci
        working-directory: apps/scholarpath

      - name: Pytest (ScholarHarvester)
        run: poetry run pytest
        working-directory: apps/scholarharvester

      - name: Vitest (ScholarStack Web)
        run: npm test -- --run
        working-directory: apps/scholarpath

  test-ios:
    name: Test Native iOS App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Test (ScholarStack iOS)
        run: swift test
        working-directory: apps/scholarstack-ios

  build:
    name: Production Build Verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-web-and-harvester, test-ios]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/scholarpath/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/scholarpath

      - name: Build Next.js app
        run: npm run build
        working-directory: apps/scholarpath
